---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - web.kurosawa.dev
  resources:
  - expressapps
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - web.kurosawa.dev
  resources:
  - expressapps/finalizers
  verbs:
  - update
- apiGroups:
  - web.kurosawa.dev
  resources:
  - expressapps/status
  verbs:
  - get
  - patch
  - update
